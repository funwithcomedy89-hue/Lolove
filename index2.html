<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Please! 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fdf5e6; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        #bg-pokemon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        
        .pokemon-sprite {
            position: absolute;
            opacity: 0;
            will-change: transform, opacity;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translate3d(0, 100vh, 0) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate3d(0, -20vh, 0) scale(1.2); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 200, 100, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h1 { color: #ff8c00; margin-bottom: 10px; font-weight: 700; transition: 0.3s; }
        
        .message-text {
            font-size: 18px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .photo-frame {
            background: white;
            padding: 10px 10px 30px 10px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto 20px auto;
            width: fit-content;
            transform: rotate(-3deg);
            transition: transform 0.3s;
            position: relative; 
        }
        
        .photo-frame:hover { transform: rotate(0deg) scale(1.05); }
        
        .photo-frame img.main-photo {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 3px;
        }

        .corner-poke {
            position: absolute;
            width: 50px;
            z-index: 20;
            display: none; 
            animation: dance 0.6s infinite alternate ease-in-out;
            will-change: transform;
        }
        
        .top-left { top: -25px; left: -25px; }
        .top-right { top: -25px; right: -25px; animation-delay: 0.2s; }
        .bottom-left { bottom: 5px; left: -25px; animation-delay: 0.4s; }
        .bottom-right { bottom: 5px; right: -25px; animation-delay: 0.6s; }

        @keyframes dance {
            0% { transform: rotate(-20deg) scale(1); }
            100% { transform: rotate(20deg) scale(1.3); }
        }

        button {
            background: #ffcc00;
            color: #d35400;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
            transition: 0.3s;
        }
        button:hover { background: #ffdb4d; transform: scale(1.05); }

    </style>
</head>
<body>

    <!-- Yahan Bruno Mars ke song ka link ya file name daal dena -->
    <audio id="magicSound" src="videoplayback (8).m4a"></audio>

    <div id="bg-pokemon"></div>

    <div class="card">
        <h1 id="mainTitle">Hey khushi! 🌟</h1>
        
        <div class="photo-frame">
            <img src="Screenshot_20260815-050318.Instagram.png" alt="Cute Photo" id="friendPhoto" class="main-photo">
            
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif" class="corner-poke top-left" id="cp1">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/133.gif" class="corner-poke top-right" id="cp2">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/39.gif" class="corner-poke bottom-left" id="cp3">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/175.gif" class="corner-poke bottom-right" id="cp4">
        </div>
        
        <p class="message-text" id="funnyMessage">
            I heard someone's mood is a bit off today. 😔<br><br>
            Just wanted to remind you that you are amazing, and your smile is brighter than a Pikachu's thunderbolt! ⚡💛
        </p>
        
        <button id="magicBtn" onclick="cheerUp()">Click for Magic! ✨</button>
    </div>

    <script>
        const pokemons = [
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/133.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/39.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/175.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/151.gif"
        ];

        pokemons.forEach(src => {
            const img = new Image();
            img.src = src;
        });

        function createBackgroundPokemon() {
            const container = document.getElementById('bg-pokemon');
            for(let i = 0; i < 12; i++) {
                let img = document.createElement('img');
                img.src = pokemons[Math.floor(Math.random() * pokemons.length)];
                img.classList.add('pokemon-sprite');
                
                img.style.left = Math.random() * 100 + 'vw';
                img.style.width = (Math.random() * 40 + 40) + 'px'; 
                img.style.animationDuration = (Math.random() * 5 + 7) + 's'; 
                img.style.animationDelay = (Math.random() * 5) + 's';
                
                container.appendChild(img);
            }
        }
        createBackgroundPokemon();

        function cheerUp() {
            const audio = document.getElementById('magicSound');
            audio.play().catch(error => console.log("Audio play blocked."));

            document.getElementById('cp1').style.display = 'block';
            document.getElementById('cp2').style.display = 'block';
            document.getElementById('cp3').style.display = 'block';
            document.getElementById('cp4').style.display = 'block';

            document.getElementById('mainTitle').innerText = "🚨 Cuteness Overload! 🚨";
            document.getElementById('funnyMessage').innerHTML = "<b>Warning:</b> System hacked by wild Pokémon! 🐾😆<br>Your sadness has been permanently deleted from the database! Pika Pika!";
            const btn = document.getElementById('magicBtn');
            btn.innerText = "Ahhh! Too many Pokémon! 🏃‍♀️💨";
            btn.style.background = "#ff4d4d";
            btn.style.color = "white";
            btn.style.transform = "rotate(-2deg)";

            const container = document.getElementById('bg-pokemon');
            const fragment = document.createDocumentFragment(); 

            for(let i = 0; i < 15; i++) {
                let img = document.createElement('img');
                img.src = pokemons[Math.floor(Math.random() * pokemons.length)];
                img.classList.add('pokemon-sprite');
                
                img.style.left = Math.random() * 100 + 'vw';
                img.style.width = '70px';
                img.style.animationDuration = '3s'; 
                img.style.animationDelay = (Math.random() * 0.5) + 's';
                
                img.style.animationIterationCount = '1';
                
                img.addEventListener('animationend', () => {
                    img.remove();
                });
                
                fragment.appendChild(img);
            }
            container.appendChild(fragment); 
        }

        window.onload = function() {
            const imgEl = document.getElementById('friendPhoto');
            if(imgEl.src.includes('Screenshot_20260815-050318.Instagram.png')) {
                imgEl.src = "https://media.tenor.com/b28JdJd3YpQAAAAj/pikachu-cute.gif"; 
            }
        }

        // Bug Fix: Pause audio when the page is minimized or tab is switched
        document.addEventListener('visibilitychange', function() {
            const audio = document.getElementById('magicSound');
            if (document.hidden) {
                audio.pause();
            }
        });
    </script>
</body>
</html>
