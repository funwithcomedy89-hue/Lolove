<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter 💌</title>
    <!-- Cute Font -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Setup & Cute Theme */
        body {
            font-family: 'Quicksand', 'Segoe UI', Tahoma, sans-serif;
            background-color: #ffe6eb;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Floating Background Hearts */
        #bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        .bg-heart {
            position: absolute;
            color: #ffb3c1;
            opacity: 0;
            animation: floatUp 8s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* Main Container */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 105, 135, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .hidden { display: none !important; }

        h2, h1 { color: #ff4d6d; margin-bottom: 20px; font-weight: 700; }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ffb3c1;
            border-radius: 15px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
        }
        textarea { height: 120px; resize: none; }
        input:focus, textarea:focus { outline: none; border-color: #ff4d6d; }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, background 0.3s;
        }
        button:hover { background: #ff2a55; transform: scale(1.05); }

        .btn-full { width: 100%; margin-top: 15px; }
        .link-box { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #ffb3c1; }

        /* Intro Mode Specifics */
        .envelope-icon {
            font-size: 90px;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Viewer Mode Specific Styles */
        .heart-icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            20% { transform: scale(1.25); }
            40% { transform: scale(1); }
            60% { transform: scale(1.25); }
        }

        .message-text {
            font-size: 20px;
            line-height: 1.6;
            margin: 20px 0;
            color: #444;
            font-weight: 500;
        }

        /* Action Buttons (Yes / No) - Same Size & Spaced */
        .action-btns {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            min-height: 50px;
        }
        #btnYes, #btnNo {
            width: 120px;
            box-sizing: border-box;
        }
        #btnYes { background: #ff4d6d; animation: heartbeat 2s infinite; }
        #btnNo { background: #adb5bd; box-shadow: none; transition: 0.1s ease; }
        
        /* Success screen images/gifs */
        .success-gif { width: 200px; border-radius: 20px; margin-bottom: 20px; }

    </style>
</head>
<body>

    <!-- Floating Hearts Container -->
    <div id="bg-hearts"></div>

    <!-- SECTION 1: The Form -->
    <div id="creator-mode" class="container">
        <h2>Make Your Apology 💌</h2>
        <p style="color: #666;">Create a cute magical link to say sorry.</p>
        
        <input type="text" id="senderName" placeholder="Your Name (e.g. Rahul)" required>
        <input type="text" id="partnerName" placeholder="Partner's Name (e.g. Priya)" required>
        <textarea id="customMessage" placeholder="Type your cute apology message here... (e.g. I am really sorry, please forgive me 🥺)" required></textarea>
        
        <button class="btn-full" onclick="generateLink()">Generate Magic Link ✨</button>

        <div id="linkContainer" class="link-box hidden">
            <p style="font-weight: bold; color: #ff4d6d;">Share this link with them:</p>
            <input type="text" id="generatedLink" readonly>
            <button class="btn-full" onclick="copyToClipboard()" style="background: #4caf50;">Copy Link 📋</button>
        </div>
    </div>

    <!-- SECTION 2: The Intro (Envelope Screen) -->
    <div id="intro-mode" class="container hidden">
        <h2 id="introTitle" style="color: #333;">Here is a letter from...</h2>
        <div class="envelope-icon">💌</div>
        <button class="btn-full" onclick="openLetter()">Open the letter ✨</button>
    </div>

    <!-- SECTION 3: The Apology (Viewer Mode) -->
    <div id="viewer-mode" class="container hidden">
        <div class="heart-icon">🥺</div>
        <h1 id="displayTitle">I am so Sorry!</h1>
        <p class="message-text" id="displayMessage"></p>
        <h3 style="color: #ff4d6d;">Yours truly, <br><span id="displaySender"></span></h3>
        
        <div style="margin-top: 30px;">
            <h3 style="color: #333;">Will you forgive me? 🥺👉👈</h3>
            <div class="action-btns">
                <button id="btnYes" onclick="forgiveMe()">YES! ❤️</button>
                <button id="btnNo">NO 😤</button>
            </div>
        </div>
    </div>

    <!-- SECTION 4: Success Screen -->
    <div id="success-mode" class="container hidden">
        <img src="https://media.tenor.com/Fw5Z1mEDd_4AAAAj/tkthao219-bubududu.gif" class="success-gif" alt="Cute Hug">
        <h1>Yayyyyy! 🥰</h1>
        <p class="message-text">I knew you would forgive me! I love you so much! ❤️</p>
        <h3 style="color: #ff4d6d;" id="successSender"></h3>
        <div class="heart-icon" style="margin-top: 20px;">💘</div>
    </div>

    <script>
        // --- BACKGROUND HEARTS GENERATOR ---
        function createBackgroundHearts() {
            const container = document.getElementById('bg-hearts');
            const heartsCount = 35;
            for(let i = 0; i < heartsCount; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.classList.add('bg-heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                container.appendChild(heart);
            }
        }
        createBackgroundHearts();

        // --- URL LOGIC ---
        function generateLink() {
            const sender = document.getElementById('senderName').value.trim();
            const partner = document.getElementById('partnerName').value.trim();
            const message = document.getElementById('customMessage').value.trim();

            if (!sender || !partner || !message) {
                alert("Please fill in all required fields.");
                return;
            }

            const payload = { s: sender, p: partner, m: message };
            const encodedData = btoa(encodeURIComponent(JSON.stringify(payload)));
            const finalUrl = window.location.origin + window.location.pathname + "?msg=" + encodedData;

            document.getElementById('generatedLink').value = finalUrl;
            document.getElementById('linkContainer').classList.remove('hidden');
        }

        async function copyToClipboard() {
            const linkInput = document.getElementById('generatedLink');
            try {
                await navigator.clipboard.writeText(linkInput.value);
                alert("Link copied to clipboard.");
            } catch (err) {
                console.error("Failed to copy text: ", err);
            }
        }

        // --- TRANSITIONS ---
        function openLetter() {
            document.getElementById('intro-mode').classList.add('hidden');
            document.getElementById('viewer-mode').classList.remove('hidden');
        }

        function forgiveMe() {
            document.getElementById('viewer-mode').classList.add('hidden');
            document.getElementById('success-mode').classList.remove('hidden');
            
            document.getElementById('bg-hearts').innerHTML = ""; 
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    let heart = document.createElement('div');
                    heart.innerHTML = '💖';
                    heart.classList.add('bg-heart');
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = '3s';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    document.getElementById('bg-hearts').appendChild(heart);
                }, i * 50);
            }
        }

        // --- RUNAWAY NO BUTTON LOGIC ---
        const btnNo = document.getElementById('btnNo');
        
        function moveButton() {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${Math.max(10, x)}px`;
            btnNo.style.top = `${Math.max(10, y)}px`;
        }

        btnNo.addEventListener('mouseenter', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // --- INITIAL CHECK ON PAGE LOAD ---
        function checkUrlForMessage() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedMsg = urlParams.get('msg');

            if (encodedMsg) {
                try {
                    const decodedData = JSON.parse(decodeURIComponent(atob(encodedMsg)));
                    
                    // Setup Text across screens
                    document.getElementById('introTitle').innerText = "Here is a letter from " + decodedData.s;
                    document.getElementById('displayTitle').innerText = "I am so Sorry, " + decodedData.p + " 🥺";
                    document.getElementById('displayMessage').innerText = decodedData.m;
                    document.getElementById('displaySender').innerText = decodedData.s;
                    document.getElementById('successSender').innerText = "- " + decodedData.s;

                    // Show Intro, Hide Creator
                    document.getElementById('creator-mode').classList.add('hidden');
                    document.getElementById('intro-mode').classList.remove('hidden');
                } catch (error) {
                    console.error("Invalid URL parameter data.");
                    document.getElementById('creator-mode').classList.remove('hidden');
                }
            }
        }

        checkUrlForMessage();
    </script>
</body>
</html>
